<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="grid-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="line-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <!-- Filter Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      .bg-grid { stroke: #1e293b; stroke-width: 1; opacity: 0.35; }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 16px;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
      
      /* Subtle CSS Keyframe Animations */
      @keyframes floatLeft {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes floatRight {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes scanflow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); transform-origin: 1050px 80px; }
        100% { transform: rotate(360deg); transform-origin: 1050px 80px; }
      }

      .floating-device { animation: floatLeft 6s ease-in-out infinite; }
      .floating-card { animation: floatRight 7s ease-in-out infinite; }
      .ambient-glow { animation: pulseGlow 5s ease-in-out infinite; }
      .scan-line {
        stroke-dasharray: 20 15;
        animation: scanflow 12s linear infinite;
      }
      .radar-arm { animation: radarSweep 10s linear infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />

  <!-- Ambient Glow Orbs in Background -->
  <circle cx="180" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="ambient-glow" />
  <circle cx="1020" cy="280" r="160" fill="#a855f7" opacity="0.12" filter="url(#glow)" class="ambient-glow" style="animation-delay: -2.5s;" />

  <!-- Geometric Grid Texture (Background) -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Circuit Flow Lines (Background) -->
  <path d="M 50 320 Q 300 320 450 220 T 800 240 T 1150 140" fill="none" stroke="url(#line-glow)" stroke-width="2.5" class="scan-line" />
  <path d="M 100 40 Q 350 40 550 140 T 950 120 T 1160 260" fill="none" stroke="url(#line-glow)" stroke-width="1.5" class="scan-line" opacity="0.5" style="animation-duration: 8s;" />

  <!-- Decorative Graphic Element Left: Mobile Device Silhouette (Background Layer) -->
  <g class="floating-device" opacity="0.75" transform="translate(60, 50)">
    <rect x="0" y="0" width="110" height="200" rx="18" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#card-shadow)" />
    <!-- Device Screen -->
    <rect x="8" y="14" width="94" height="172" rx="12" fill="#0f172a" />
    <rect x="38" y="20" width="34" height="4" rx="2" fill="#475569" />
    <!-- Mock UI Elements on Device Screen -->
    <rect x="18" y="38" width="74" height="28" rx="6" fill="#38bdf8" opacity="0.25" />
    <circle cx="28" cy="52" r="5" fill="#38bdf8" />
    <line x1="38" y1="49" x2="78" y2="49" stroke="#38bdf8" stroke-width="2" />
    <line x1="38" y1="55" x2="65" y2="55" stroke="#94a3b8" stroke-width="2" />

    <!-- Test Automation Check Status -->
    <rect x="18" y="76" width="74" height="18" rx="4" fill="#22c55e" opacity="0.15" />
    <circle cx="27" cy="85" r="3.5" fill="#22c55e" />
    <line x1="35" y1="85" x2="72" y2="85" stroke="#22c55e" stroke-width="1.5" />

    <rect x="18" y="100" width="74" height="18" rx="4" fill="#a855f7" opacity="0.15" />
    <circle cx="27" cy="109" r="3.5" fill="#a855f7" />
    <line x1="35" y1="109" x2="68" y2="109" stroke="#c084fc" stroke-width="1.5" />

    <rect x="18" y="124" width="74" height="18" rx="4" fill="#38bdf8" opacity="0.15" />
    <circle cx="27" cy="133" r="3.5" fill="#38bdf8" />
    <line x1="35" y1="133" x2="64" y2="133" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Pulse Ripple Indicator -->
    <circle cx="55" cy="162" r="12" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.8">
      <animate attributeName="r" values="6;16;6" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="55" cy="162" r="4" fill="#22c55e" />
  </g>

  <!-- Decorative Graphic Element Right: Dynamic Telemetry Node (Background Layer) -->
  <g class="floating-card" opacity="0.8" transform="translate(1010, 60)">
    <rect x="0" y="0" width="130" height="180" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#card-shadow)" />
    <!-- Header -->
    <rect x="12" y="14" width="60" height="8" rx="4" fill="#818cf8" opacity="0.6" />
    <circle cx="112" cy="18" r="4" fill="#22c55e" />
    <!-- Mini Histogram / Telemetry Bars -->
    <g transform="translate(14, 40)">
      <rect x="0" y="50" width="12" height="40" rx="2" fill="#38bdf8" opacity="0.5">
        <animate attributeName="height" values="40;65;40" dur="4s" repeatCount="indefinite" />
        <animate attributeName="y" values="50;25;50" dur="4s" repeatCount="indefinite" />
      </rect>
      <rect x="18" y="30" width="12" height="60" rx="2" fill="#818cf8" opacity="0.7">
        <animate attributeName="height" values="60;35;60" dur="3.5s" repeatCount="indefinite" />
        <animate attributeName="y" values="30;55;30" dur="3.5s" repeatCount="indefinite" />
      </rect>
      <rect x="36" y="20" width="12" height="70" rx="2" fill="#c084fc" opacity="0.85">
        <animate attributeName="height" values="70;85;70" dur="4.5s" repeatCount="indefinite" />
        <animate attributeName="y" values="20;5;20" dur="4.5s" repeatCount="indefinite" />
      </rect>
      <rect x="54" y="45" width="12" height="45" rx="2" fill="#22c55e" opacity="0.7">
        <animate attributeName="height" values="45;25;45" dur="3.2s" repeatCount="indefinite" />
        <animate attributeName="y" values="45;65;45" dur="3.2s" repeatCount="indefinite" />
      </rect>
      <rect x="72" y="15" width="12" height="75" rx="2" fill="#38bdf8" opacity="0.9">
        <animate attributeName="height" values="75;50;75" dur="3.8s" repeatCount="indefinite" />
        <animate attributeName="y" values="15;40;15" dur="3.8s" repeatCount="indefinite" />
      </rect>
      <rect x="90" y="35" width="12" height="55" rx="2" fill="#f43f5e" opacity="0.6">
        <animate attributeName="height" values="55;70;55" dur="4.2s" repeatCount="indefinite" />
        <animate attributeName="y" values="35;20;35" dur="4.2s" repeatCount="indefinite" />
      </rect>
    </g>
    <!-- Label -->
    <rect x="14" y="146" width="102" height="18" rx="4" fill="#0f172a" />
    <text x="65" y="159" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">PARALLEL SUITES</text>
  </g>

  <!-- ================= FOREGROUND CONTENT (UNOBSTRUCTED) ================= -->
  <!-- Top Category Tag / Badge -->
  <g transform="translate(600, 72)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)" opacity="0.9" />
    <circle cx="-116" cy="0" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="-98" y="5" fill="#38bdf8" class="badge-text" letter-spacing="1.2">CURATED AWESOME LIST</text>
  </g>

  <!-- Primary Foreground Title -->
  <text x="600" y="145" text-anchor="middle" fill="url(#title-grad)" class="title-text" filter="url(#card-shadow)">
    Awesome Low-Code Mobile Test Automation
  </text>

  <!-- Foreground Subtitle -->
  <text x="600" y="195" text-anchor="middle" fill="url(#sub-grad)" class="subtitle-text">
    A curated collection of top codeless testing platforms, AI test recorders, and declarative mobile frameworks
  </text>

  <!-- Category Pills / Feature Highlights (Foreground) -->
  <g transform="translate(600, 255)">
    <!-- Pill 1: iOS & Android -->
    <g transform="translate(-320, 0)">
      <rect x="0" y="0" width="145" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="18" r="4" fill="#38bdf8" />
      <text x="32" y="23" fill="#e2e8f0" class="badge-text">📱 iOS &amp; Android</text>
    </g>

    <!-- Pill 2: AI Self-Healing -->
    <g transform="translate(-160, 0)">
      <rect x="0" y="0" width="150" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="18" r="4" fill="#818cf8" />
      <text x="32" y="23" fill="#e2e8f0" class="badge-text">🤖 AI Self-Healing</text>
    </g>

    <!-- Pill 3: Visual Recorders -->
    <g transform="translate(6, 0)">
      <rect x="0" y="0" width="165" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="18" r="4" fill="#c084fc" />
      <text x="32" y="23" fill="#e2e8f0" class="badge-text">🎥 Visual Recorders</text>
    </g>

    <!-- Pill 4: Real-Device Clouds -->
    <g transform="translate(186, 0)">
      <rect x="0" y="0" width="155" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="20" cy="18" r="4" fill="#22c55e" />
      <text x="32" y="23" fill="#e2e8f0" class="badge-text">☁️ Cloud Test Farms</text>
    </g>
  </g>

  <!-- Bottom Sub-bar Accent Line -->
  <rect x="450" y="318" width="300" height="3" rx="1.5" fill="url(#line-glow)" />
</svg>